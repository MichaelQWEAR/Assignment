<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Parallax</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="hero parallax">
      <div class="card">
        <h1>Move</h1>
        <p>Scroll to explore the layers.</p>
      </div>
    </section>

    <section class="content">
      <h2>Keep Moving</h2>
      <p>
        This section scrolls normally while the background image stays fixed,
        creating a simple parallax effect.
      </p>
    </section>

    <section class="flowers parallax">
      <div class="card">
        <h2>Almost There</h2>
        <p>The change makes a difference.</p>
      </div>
    </section>

    <section class="content">
      <h2>That's It!</h2>
      <p>This effect uses only HTML and CSS.</p>
    </section>
  </body>
</html>
